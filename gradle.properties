# gradle.properties — Project-wide Gradle and Android build properties
#
# These settings apply to all modules in the project. Machine-specific
# overrides (e.g., on low-RAM CI agents) can be placed in ~/.gradle/gradle.properties
# which takes precedence over this file.
#
# Part of litert-android-boilerplate by Necessity Labs
# Created: 2025-05-02

# ── JVM heap ─────────────────────────────────────────────────────────────────
# 2 GB is a reasonable default for modern development workstations. On machines
# with ≤ 8 GB RAM (e.g., some CI agents), lower this to -Xmx1g to avoid
# swapping. On machines with ≥ 32 GB RAM you can raise it to -Xmx4g to speed
# up parallel compilation.
org.gradle.jvmargs=-Xmx2g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# ── Parallel execution ────────────────────────────────────────────────────────
# Builds independent modules concurrently. Disable this (set to false) on
# machines with fewer than 8 GB RAM to avoid thrashing between Gradle workers.
org.gradle.parallel=true

# ── Gradle daemon ─────────────────────────────────────────────────────────────
# Keep a warm Gradle daemon between builds for significantly faster incremental
# builds. The daemon is automatically stopped after 3 hours of inactivity.
org.gradle.daemon=true

# ── Configuration cache (opt-in) ──────────────────────────────────────────────
# Caches the task graph between builds. Disabled by default until all plugins
# in this project are verified compatible with the configuration cache.
# Enable by running with --configuration-cache or setting this to true.
org.gradle.configuration-cache=false

# ── AndroidX ─────────────────────────────────────────────────────────────────
# Required — instructs AGP to use AndroidX artifacts instead of the deprecated
# android.support.* namespace.
android.useAndroidX=true

# ── Kotlin code style ─────────────────────────────────────────────────────────
# Sets the official Kotlin coding conventions for IDE inspections (IntelliJ /
# Android Studio). Does not affect compilation.
kotlin.code.style=official

# ── Non-transitive R classes ──────────────────────────────────────────────────
# Each module generates its own R class containing only the resources declared
# in that module (not all transitive resources). This reduces build time and
# prevents accidental cross-module resource access.
android.nonTransitiveRClass=true

# ── Build features defaults ───────────────────────────────────────────────────
# Disable build features that are not used in this project to reduce build
# time. Individual modules can re-enable them in their own build.gradle.kts.
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
