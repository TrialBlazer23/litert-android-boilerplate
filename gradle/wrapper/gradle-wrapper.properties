# gradle/wrapper/gradle-wrapper.properties — Gradle wrapper distribution config
#
# Pins the Gradle version used for all builds in this repository. Changing
# the distributionUrl here is the only supported way to upgrade Gradle —
# do not edit the wrapper JAR or shell scripts manually.
#
# Gradle 8.11.1 is used here because:
#  • It is compatible with AGP 8.7.3.
#  • It includes full Kotlin DSL support for the configuration used in this
#    project (version catalogs, `libs` type-safe accessors).
#
# Part of litert-android-boilerplate by Necessity Labs
# Created: 2025-05-02

distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
